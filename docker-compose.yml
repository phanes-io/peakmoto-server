services:
  # GraphHopper runs natively as systemd service (see graphhopper/README.md)
  # Traefik routes routing.peakmoto.app via file provider to host:8989

  photon:
    build: ./photon
    container_name: peakmoto-photon
    volumes:
      - ./photon/data:/photon/photon_data
    restart: unless-stopped
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.peakmoto-photon.rule=Host(`photon.peakmoto.app`)"
      - "traefik.http.routers.peakmoto-photon.entrypoints=websecure"
      - "traefik.http.routers.peakmoto-photon.tls=true"
      - "traefik.http.routers.peakmoto-photon.tls.certresolver=cloudflare"
      - "traefik.http.services.peakmoto-photon.loadbalancer.server.port=2322"

  tileserver:
    image: maptiler/tileserver-gl:latest
    container_name: peakmoto-tiles
    volumes:
      - ./tiles:/data
    restart: unless-stopped
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.peakmoto-tiles.rule=Host(`tiles.peakmoto.app`)"
      - "traefik.http.routers.peakmoto-tiles.entrypoints=websecure"
      - "traefik.http.routers.peakmoto-tiles.tls=true"
      - "traefik.http.routers.peakmoto-tiles.tls.certresolver=cloudflare"
      - "traefik.http.services.peakmoto-tiles.loadbalancer.server.port=8080"

  feedback:
    build: ./feedback
    container_name: peakmoto-feedback
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    restart: unless-stopped
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.peakmoto-feedback.rule=Host(`feedback.peakmoto.app`)"
      - "traefik.http.routers.peakmoto-feedback.entrypoints=websecure"
      - "traefik.http.routers.peakmoto-feedback.tls=true"
      - "traefik.http.routers.peakmoto-feedback.tls.certresolver=cloudflare"
      - "traefik.http.services.peakmoto-feedback.loadbalancer.server.port=8000"
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: peakmoto-watchtower
    command: --interval 86400 --label-enable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  frontend:
    external: true
