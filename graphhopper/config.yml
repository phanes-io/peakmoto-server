graphhopper:
  datareader.file: /opt/peakmoto-server/graphhopper/dach-latest.osm.pbf
  graph.location: /opt/peakmoto-server/graphhopper/graph-cache
  graph.elevation.provider: srtm
  graph.elevation.cache_dir: /opt/peakmoto-server/graphhopper/elevation-cache

  graph.encoded_values: >
    road_class, road_class_link, road_environment, road_access,
    surface, smoothness, toll, track_type,
    curvature, urban_density, country,
    max_speed, lanes, roundabout,
    car_access, car_average_speed,
    average_slope, max_slope

  graph.urban_density.threads: 4

  profiles:
    # === FAST: Schnellste Route, Autobahn OK ===
    - name: motorcycle_fast
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model:
        priority:
          - if: "road_class == TRACK || road_class == BRIDLEWAY || road_class == STEPS || road_class == FOOTWAY || road_class == CYCLEWAY"
            multiply_by: "0.01"
          - if: "road_class == SERVICE"
            multiply_by: "0.15"
          - if: "surface != ASPHALT && surface != PAVED && surface != PAVING_STONES && surface != CONCRETE && surface != MISSING"
            multiply_by: "0.05"
          - if: "track_type != MISSING && track_type != GRADE1"
            multiply_by: "0.05"
          - if: "road_class == RESIDENTIAL || road_class == LIVING_STREET"
            multiply_by: "0.6"
        speed:
          - if: "true"
            limit_to: "120"
          - if: "road_class == TRUNK"
            limit_to: "90"
          - if: "road_class == PRIMARY"
            limit_to: "80"
          - if: "road_class == SECONDARY"
            limit_to: "70"
          - if: "road_class == TERTIARY"
            limit_to: "60"
          - if: "road_class == RESIDENTIAL || road_class == LIVING_STREET"
            limit_to: "40"
          - if: "road_class == SERVICE"
            limit_to: "20"
        distance_influence: 90

    # === BALANCED: Mix von Highway und Landstraße, leichte Kurvenpräferenz ===
    - name: motorcycle_balanced
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model:
        priority:
          - if: "road_class == TRACK || road_class == BRIDLEWAY || road_class == STEPS || road_class == FOOTWAY || road_class == CYCLEWAY"
            multiply_by: "0.01"
          - if: "road_class == SERVICE"
            multiply_by: "0.15"
          - if: "surface != ASPHALT && surface != PAVED && surface != PAVING_STONES && surface != CONCRETE && surface != MISSING"
            multiply_by: "0.05"
          - if: "track_type != MISSING && track_type != GRADE1"
            multiply_by: "0.05"
          - if: "road_class == MOTORWAY"
            multiply_by: "0.4"
          - if: "road_class == TRUNK"
            multiply_by: "0.6"
          - if: "road_class == UNCLASSIFIED"
            multiply_by: "0.5"
          - if: "road_class == RESIDENTIAL || road_class == LIVING_STREET"
            multiply_by: "0.4"
          - if: "curvature >= 0.95"
            multiply_by: "0.5"
          - if: "curvature >= 0.90"
            multiply_by: "0.7"
          - if: "urban_density == CITY"
            multiply_by: "0.5"
        speed:
          - if: "true"
            limit_to: "120"
          - if: "road_class == TRUNK"
            limit_to: "90"
          - if: "road_class == PRIMARY"
            limit_to: "80"
          - if: "road_class == SECONDARY"
            limit_to: "70"
          - if: "road_class == TERTIARY"
            limit_to: "60"
          - if: "road_class == RESIDENTIAL || road_class == LIVING_STREET"
            limit_to: "40"
          - if: "road_class == SERVICE"
            limit_to: "20"
        distance_influence: 70

    # === CURVY: Landstraßen bevorzugen, region-adaptiv über curvature ===
    - name: motorcycle_curvy
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 120
      custom_model:
        priority:
          # Basis: keine schlechten Wege
          - if: "road_class == TRACK || road_class == BRIDLEWAY || road_class == STEPS || road_class == FOOTWAY || road_class == CYCLEWAY"
            multiply_by: "0.01"
          - if: "road_class == SERVICE"
            multiply_by: "0.1"
          - if: "surface != ASPHALT && surface != PAVED && surface != PAVING_STONES && surface != CONCRETE && surface != MISSING"
            multiply_by: "0.05"
          - if: "track_type != MISSING && track_type != GRADE1"
            multiply_by: "0.05"

          # Hochgeschwindigkeitsstraßen raus
          - if: "road_class == MOTORWAY"
            multiply_by: "0.05"
          - if: "road_class == TRUNK"
            multiply_by: "0.15"

          # Gerade Primary bestrafen (B1/B64 in Paderborn)
          - if: "road_class == PRIMARY && curvature >= 0.90"
            multiply_by: "0.2"
          - if: "road_class == PRIMARY && curvature >= 0.80"
            multiply_by: "0.4"

          # Unclassified aggressiv raus (Feldwege → viele Abbiegungen)
          - if: "road_class == UNCLASSIFIED"
            multiply_by: "0.25"

          # Wohngebiete raus (viele Abbiegungen)
          - if: "road_class == RESIDENTIAL || road_class == LIVING_STREET"
            multiply_by: "0.2"

          # Gerade Landstraßen auch leicht bestrafen
          - if: "road_class == SECONDARY && curvature >= 0.90"
            multiply_by: "0.6"
          - if: "road_class == TERTIARY && curvature >= 0.90"
            multiply_by: "0.6"

          # Belohnung kurviger Landstraßen (ideale Motorrad-Strecken)
          - if: "road_class == SECONDARY && curvature < 0.6"
            multiply_by: "1.8"
          - if: "road_class == TERTIARY && curvature < 0.6"
            multiply_by: "1.8"
          - if: "road_class == SECONDARY && curvature < 0.4"
            multiply_by: "2.2"
          - if: "road_class == TERTIARY && curvature < 0.4"
            multiply_by: "2.2"

          # Kurvige Primary belohnen (B500 Schwarzwald, B107 Großglockner, Alpenstraße)
          - if: "road_class == PRIMARY && curvature < 0.6"
            multiply_by: "1.6"
          - if: "road_class == PRIMARY && curvature < 0.5"
            multiply_by: "1.8"
          - if: "road_class == PRIMARY && curvature < 0.3"
            multiply_by: "2.2"

          # Städte aggressiv meiden
          - if: "urban_density == RESIDENTIAL"
            multiply_by: "0.4"
          - if: "urban_density == CITY"
            multiply_by: "0.15"
        speed:
          - if: "true"
            limit_to: "120"
          - if: "road_class == TRUNK"
            limit_to: "90"
          - if: "road_class == PRIMARY"
            limit_to: "80"
          - if: "road_class == SECONDARY"
            limit_to: "70"
          - if: "road_class == TERTIARY"
            limit_to: "60"
          - if: "road_class == RESIDENTIAL || road_class == LIVING_STREET"
            limit_to: "40"
          - if: "road_class == SERVICE"
            limit_to: "20"
        distance_influence: 40

    # === TWISTY: Extrem kurvig, große Umwege für die besten Kurven ===
    - name: motorcycle_twisty
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 120
      custom_model:
        priority:
          - if: "road_class == TRACK || road_class == BRIDLEWAY || road_class == STEPS || road_class == FOOTWAY || road_class == CYCLEWAY"
            multiply_by: "0.01"
          - if: "road_class == SERVICE"
            multiply_by: "0.05"
          - if: "surface != ASPHALT && surface != PAVED && surface != PAVING_STONES && surface != CONCRETE && surface != MISSING"
            multiply_by: "0.05"
          - if: "track_type != MISSING && track_type != GRADE1"
            multiply_by: "0.05"

          # Hochgeschwindigkeitsstraßen quasi raus
          - if: "road_class == MOTORWAY"
            multiply_by: "0.02"
          - if: "road_class == TRUNK"
            multiply_by: "0.08"

          # Gerade Primary hart raus (Twisty toleriert noch weniger)
          - if: "road_class == PRIMARY && curvature >= 0.90"
            multiply_by: "0.1"
          - if: "road_class == PRIMARY && curvature >= 0.80"
            multiply_by: "0.25"
          - if: "road_class == PRIMARY && curvature >= 0.70"
            multiply_by: "0.5"

          # Unclassified extrem raus (Feldwege/Wirtschaftswege)
          - if: "road_class == UNCLASSIFIED"
            multiply_by: "0.08"

          # Wohngebiete raus
          - if: "road_class == RESIDENTIAL || road_class == LIVING_STREET"
            multiply_by: "0.05"

          # Gerade Landstraßen stärker bestraft
          - if: "road_class == SECONDARY && curvature >= 0.90"
            multiply_by: "0.4"
          - if: "road_class == TERTIARY && curvature >= 0.90"
            multiply_by: "0.4"
          - if: "road_class == SECONDARY && curvature >= 0.80"
            multiply_by: "0.65"
          - if: "road_class == TERTIARY && curvature >= 0.80"
            multiply_by: "0.65"

          # Stärkere Belohnung kurviger Landstraßen (mäßiger damit Twisty nicht abdreht)
          - if: "road_class == SECONDARY && curvature < 0.6"
            multiply_by: "2.0"
          - if: "road_class == TERTIARY && curvature < 0.6"
            multiply_by: "2.0"
          - if: "road_class == SECONDARY && curvature < 0.4"
            multiply_by: "2.5"
          - if: "road_class == TERTIARY && curvature < 0.4"
            multiply_by: "2.5"
          - if: "road_class == SECONDARY && curvature < 0.25"
            multiply_by: "3.0"
          - if: "road_class == TERTIARY && curvature < 0.25"
            multiply_by: "3.0"

          # Stärkere Belohnung kurviger Primary (Serpentinen-Passstraßen wie Großglockner)
          - if: "road_class == PRIMARY && curvature < 0.5"
            multiply_by: "1.8"
          - if: "road_class == PRIMARY && curvature < 0.3"
            multiply_by: "2.5"
          - if: "road_class == PRIMARY && curvature < 0.2"
            multiply_by: "3.0"

          # Städte aggressiv meiden
          - if: "urban_density == RESIDENTIAL"
            multiply_by: "0.3"
          - if: "urban_density == CITY"
            multiply_by: "0.1"
        speed:
          - if: "true"
            limit_to: "120"
          - if: "road_class == TRUNK"
            limit_to: "90"
          - if: "road_class == PRIMARY"
            limit_to: "80"
          - if: "road_class == SECONDARY"
            limit_to: "70"
          - if: "road_class == TERTIARY"
            limit_to: "60"
          - if: "road_class == RESIDENTIAL || road_class == LIVING_STREET"
            limit_to: "40"
          - if: "road_class == SERVICE"
            limit_to: "20"
        distance_influence: 30

    # === Legacy motorcycle profile (Abwärtskompatibilität) ===
    - name: motorcycle
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model:
        priority:
          - if: "road_class == TRACK || road_class == BRIDLEWAY || road_class == STEPS || road_class == FOOTWAY || road_class == CYCLEWAY"
            multiply_by: "0.01"
          - if: "road_class == SERVICE"
            multiply_by: "0.15"
          - if: "surface != ASPHALT && surface != PAVED && surface != PAVING_STONES && surface != CONCRETE && surface != MISSING"
            multiply_by: "0.05"
          - if: "track_type != MISSING && track_type != GRADE1"
            multiply_by: "0.05"
          - if: "road_class == MOTORWAY || road_class == TRUNK"
            multiply_by: "0.3"
          - if: "road_class == RESIDENTIAL || road_class == LIVING_STREET"
            multiply_by: "0.4"
          - if: "curvature >= 0.95"
            multiply_by: "0.5"
        speed:
          - if: "true"
            limit_to: "120"
        distance_influence: 90

  profiles_lm: []

  import.osm.ignored_highways: footway,construction,cycleway,path,steps

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 0.0.0.0
